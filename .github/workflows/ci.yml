name: CI

# Jobs are independent so each owner can add or change theirs without touching
# the others: branch-name (repo rule), backend-* (Atta), frontend (Neelam).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name (<name>/pNN-topic or <name>/fix-<partner>-pNN-topic)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # <name>/pNN-topic, or a review fix in a partner's files:
          # <name>/fix-<partner>-pNN-topic (CLAUDE.md, "Branches and pull requests").
          phase='^(atta|asim|neelam)/p[0-9]{2}-[a-z0-9-]+$'
          fix='^(atta|asim|neelam)/fix-(atta|asim|neelam)-p[0-9]{2}-[a-z0-9-]+$'
          if [[ ! "$BRANCH" =~ $phase && ! "$BRANCH" =~ $fix ]]; then
            echo "::error::Branch '$BRANCH' must match <name>/pNN-topic (e.g. atta/p01-repo-setup) or <name>/fix-<partner>-pNN-topic (e.g. atta/fix-asim-p11-check-specs); name and partner: atta|asim|neelam"
            exit 1
          fi

  backend-lint:
    name: Backend lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . --output-format=github
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: Spec files (config/*.yaml)
        run: python scripts/validate_specs.py all
      - name: docs/openapi.json is current
        run: python scripts/export_openapi.py --check

  backend-test:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cawasma
          POSTGRES_PASSWORD: cawasma
          POSTGRES_DB: cawasma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cawasma -d cawasma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
      DATABASE_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
      ALEMBIC_SQLALCHEMY_URL: postgresql+asyncpg://cawasma:cawasma@localhost:5432/cawasma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # WeasyPrint native libs, so the PDF report path is exercised too.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Models and migrations are in sync
        run: alembic check
      - name: Migrations roll back cleanly
        run: alembic downgrade base
      - name: pytest
        run: pytest -q

  # ------------------------------------------------------------- frontend
  # Neelam. Node 22: shadcn's `cn` package requires it.
  frontend:
    name: Frontend lint, type-check, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      # Flows, axe accessibility checks and the 600-finding performance check,
      # against a mock-mode build (MSW, no backend needed).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, mock API)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Neelam. The whole journey on the real stack and a real evaluation target:
  # new scan -> live status (SSE) -> results -> filter -> drill-down -> export,
  # scanning VAmPI behind the eval TLS front (frontend/scripts/eval-stack.sh).
  frontend-e2e-eval:
    name: Frontend end-to-end on VAmPI (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: 1
      INSTALL_ML: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certificate helper dependency
        run: pip install cryptography
      - name: Start VAmPI (TLS front) and CAWASMA (api + worker)
        run: bash frontend/scripts/eval-stack.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Full flow (Playwright)
        working-directory: frontend
        env:
          E2E_TARGET_URL: https://vampi-tls/
        run: npm run test:e2e:real -- eval-flow
      - name: CAWASMA logs
        if: failure()
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.eval-scan.yml
          logs --tail 300 api worker
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-eval
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: bash frontend/scripts/eval-stack.sh down
