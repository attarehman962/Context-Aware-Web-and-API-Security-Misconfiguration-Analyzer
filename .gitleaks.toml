# gitleaks config: the default rules, plus the fake values our tests need.
#   gitleaks git --config .gitleaks.toml .     (history)
#   gitleaks dir --config .gitleaks.toml backend   (working tree)
[extend]
useDefault = true

[allowlist]
description = "fake secrets in test fixtures and in commits before 2026-11-05"
# Response bodies the body classifier must flag; every value is made up.
paths = ['''backend/tests/fixtures/bodies/''']
# Commits that added made-up, provider-shaped test values (Stripe-, JWT- and
# AWS-shaped), since replaced by cawasma-fake-* or assembled at run time. None
# was ever a real credential; history is kept as it is. The last one is the
# audit report, which quoted one of them.
