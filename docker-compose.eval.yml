# CAWASMA evaluation targets (owner: Asim).
#
# The images are pinned for reproducibility. The evaluation network is internal:
# no outbound (internet) access, and Docker does not publish host ports for it,
# so targets are reached from inside the network by service name
# (http://juice-shop:3000, http://dvwa, http://vampi:5000, http://crapi-web).
#
# Start with: make eval-up      Collect endpoints with: make eval-collect

name: cawasma-eval

# CAWASMA's own ALLOWED_INTERNAL_HOSTS (juice-shop, dvwa, vampi, crapi-web)
# belongs in a separate override for its api/worker when they join this
# network for eval scans; the target containers below don't read it.

services:
  juice-shop:
    image: bkimminich/juice-shop@sha256:318714401c46c3c0a2458b5dccfc84af8e4839181d1a723701f8a6822b19294f
    hostname: juice-shop
    networks: [eval]
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3000/', r =>
          process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () =>
          process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dvwa:
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    hostname: dvwa
    networks: [eval]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$f=@fopen("http://127.0.0.1/", "r"); exit($$f === false ? 1 :
          0);'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  vampi:
    image: erev0s/vampi@sha256:7ba0b0a8a2f2a33059054b13c98e932c3102687bd3f687df8952e36575927f1b
    hostname: vampi
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  crapi-identity:
    image: crapi/crapi-identity@sha256:327ab8561472891a5bc2145ba877de01e717674fa271834d22229ed4df8fc36d
    hostname: crapi-identity
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi-postgres
      DB_PORT: "5432"
      SERVER_PORT: "8080"
      JWT_SECRET: cawasma-eval
      MAILHOG_HOST: crapi-mailhog
      MAILHOG_PORT: "1025"
      MAILHOG_DOMAIN: example.com
      SMTP_HOST: crapi-mailhog
      SMTP_PORT: "1025"
      SMTP_EMAIL: eval@example.com
      SMTP_PASS: cawasma-eval
      SMTP_FROM: no-reply@example.com
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      API_GATEWAY_URL: http://crapi-web
      ENABLE_SHELL_INJECTION: "false"
      TLS_ENABLED: "false"
    depends_on:
      crapi-postgres:
        condition: service_healthy
      crapi-mongo:
        condition: service_healthy
      crapi-mailhog:
        condition: service_healthy
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  crapi-community:
    image: crapi/crapi-community@sha256:e5defa174e410bb615c14f257d52066d0534b87c4f4e25a93e4a12a0aea99323
    hostname: crapi-community
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi-postgres
      DB_PORT: "5432"
      SERVER_PORT: "8087"
      IDENTITY_SERVICE: crapi-identity:8080
      MONGO_DB_HOST: crapi-mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      TLS_ENABLED: "false"
    depends_on:
      crapi-postgres:
        condition: service_healthy
      crapi-mongo:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  crapi-workshop:
    image: crapi/crapi-workshop@sha256:ab904182110a1ab11cef43cfd86c898c1139ebb08181ba7775dbcff8db2ea8cf
    hostname: crapi-workshop
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: crapi-postgres
      DB_PORT: "5432"
      SERVER_PORT: "8000"
      IDENTITY_SERVICE: crapi-identity:8080
      MONGO_DB_HOST: crapi-mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_USER: admin
      MONGO_DB_PASSWORD: crapisecretpassword
      MONGO_DB_NAME: crapi
      SECRET_KEY: cawasma-eval
      API_GATEWAY_URL: http://crapi-web
      TLS_ENABLED: "false"
    depends_on:
      crapi-postgres:
        condition: service_healthy
      crapi-mongo:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-community:
        condition: service_healthy
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "/app/health.sh"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  crapi-web:
    image: crapi/crapi-web@sha256:b14b5964af336d200449e28ffac9371e8929d4450f1e53e2787b4401adc31695
    hostname: crapi-web
    environment:
      COMMUNITY_SERVICE: crapi-community:8087
      IDENTITY_SERVICE: crapi-identity:8080
      WORKSHOP_SERVICE: crapi-workshop:8000
      CHATBOT_SERVICE: crapi-community:8087
      MAILHOG_WEB_SERVICE: crapi-mailhog:8025
      TLS_ENABLED: "false"
    depends_on:
      crapi-community:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
      crapi-workshop:
        condition: service_healthy
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 45s

  crapi-postgres:
    image: postgres@sha256:a28005f051c26406f8e718e411a1068462a297dae049cddb513194d36dd8f29f
    hostname: crapi-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crapi"]
      interval: 10s
      timeout: 5s
      retries: 12

  crapi-mongo:
    image: mongo@sha256:6189a342f8da4568b4b111c378a890b1fe186b1bc133742bff8811fe63d2e01e
    hostname: crapi-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  crapi-mailhog:
    image: crapi/mailhog@sha256:48054e74c771688f167d648d6d2e8c8f5f2244720ea0ab5e4e2ae37056e67e6c
    hostname: crapi-mailhog
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@crapi-mongo:27017
      MH_STORAGE: mongodb
    networks: [eval]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8025"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Evaluation harness (eval/harness/run_all.py, `make eval`) -----------
  # TLS front: CAWASMA scans HTTPS only, the targets speak HTTP. nginx serves
  # each target as https://<target>-tls with a certificate the harness makes
  # per run (eval/.run/tls); transparent (eval/harness/tls-front/nginx.conf).
  # Profile "scan": it needs that certificate, so plain `make eval-up` skips it.
  tls-front:
    image: nginx@sha256:814a8e88df978ade80e584cc5b333144b9372a8e3c98872d07137dbf3b44d0e4  # nginx:1.27.3-alpine
    profiles: [scan]
    volumes:
      - ./eval/harness/tls-front/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./eval/.run/tls:/tls:ro
    networks:
      eval:
        aliases: [juice-shop-tls, dvwa-tls, vampi-tls, crapi-tls]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q && test -s /var/run/nginx.pid"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Baseline tools, run one-off by the harness (pinned versions).
  zap:
    image: zaproxy/zap-stable@sha256:8dc78e39fafc3281ac2cf54eab05c3ea02721a1ea58f1c135f981a57f4e218b1  # 2.15.0
    profiles: [tools]
    networks: [eval]

  nuclei:
    image: projectdiscovery/nuclei@sha256:66b5f88c9b98ad29c03343dd34e5e85bde0ad10428d72e0171b067efe1ed7811  # v3.9.0
    profiles: [tools]
    volumes:
      - ./eval/.cache/nuclei-templates-10.1.1:/templates:ro   # make eval-templates
    networks: [eval]

  # One-off endpoint collector (eval/labels/collect_endpoints.py) on the eval
  # network: make eval-collect. Standard library only (no egress for pip).
  collector:
    image: python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704  # python:3.12-slim
    profiles: [tools]
    user: "${EVAL_UID:-1000}:${EVAL_GID:-1000}"
    working_dir: /eval
    volumes:
      - ./eval:/eval
    command: ["python", "labels/collect_endpoints.py"]
    networks: [eval]

networks:
  eval:
    name: cawasma-eval
    internal: true
