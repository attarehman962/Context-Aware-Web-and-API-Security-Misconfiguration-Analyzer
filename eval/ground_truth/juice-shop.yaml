  expected: present
  source: 'official docs: https://pwning.owasp-juice.shop/companion-guide/latest/; observed passive GET/OPTIONS,
    2026-10-27 (observed/juice-shop.json)'
  notes: 'Preflight answers Access-Control-Allow-Origin: * (no credentials).'
