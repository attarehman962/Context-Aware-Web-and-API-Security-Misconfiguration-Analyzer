must_not_fire:
- check_id: HDR-008
  reason: No X-Powered-By on any observed response.
- check_id: COR-003
  reason: Allow-Origin * is never combined with Allow-Credentials.
- check_id: CKI-001
  reason: No cookies are set on unauthenticated responses (the token cookie is set client-side after login).
- check_id: CKI-002
  reason: As CKI-001.
- check_id: CKI-003
  reason: As CKI-001.
- check_id: INF-003
  reason: No .env file; /.env is the SPA index page.
- check_id: INF-004
  reason: No .git metadata; /.git/* is the SPA index page.
