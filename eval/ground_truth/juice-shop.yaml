# Ground truth for juice-shop: starter list from the official docs, checked against a
# passive observation of the pinned image. Every entry stays 'unverified'
# until confirmed by hand. check_ids come from config/checks.yaml.
target: juice-shop
base_url: http://juice-shop:3000
status: starter-unverified
evidence: observed/juice-shop.json
known_issues:
- endpoint: /
  check_id: HDR-002
  expected: present
  source: 'official docs: https://pwning.owasp-juice.shop/companion-guide/latest/; observed passive GET/OPTIONS,
    2026-10-27 (observed/juice-shop.json)'
  notes: No Content-Security-Policy on the app shell.
  verification: unverified
- endpoint: /
