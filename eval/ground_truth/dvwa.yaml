# Ground truth for dvwa: starter list from the official docs, checked against a
# passive observation of the pinned image. Every entry stays 'unverified'
# until confirmed by hand. check_ids come from config/checks.yaml.
target: dvwa
base_url: http://dvwa:80
status: starter-unverified
evidence: observed/dvwa.json
setup_note: Unauthenticated, every page but login/setup redirects to login.php; the database is created
  on setup.php (POST, by hand).
