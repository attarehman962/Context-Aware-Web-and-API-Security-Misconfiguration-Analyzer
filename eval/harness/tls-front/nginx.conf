# TLS front for the evaluation targets (Asim). CAWASMA scans HTTPS only; the
# targets speak plain HTTP, so this terminates TLS for each one under its own
# name. The certificate comes from a CA the harness generates per run
# (eval/.run/tls/), which CAWASMA trusts through SCAN_CA_BUNDLE.
#
# Kept transparent on purpose, so findings describe the target, not the proxy:
# - the target's own Server header is passed through; nginx's own Server
#   header carries no version (server_tokens off) when the target sends none;
# - no security headers are added;
# - absolute http:// redirects are rewritten to https://.

worker_processes 1;
events { worker_connections 256; }

http {
    server_tokens off;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;     # Docker's DNS on the eval network

    map $host $target_upstream {
        juice-shop-tls  juice-shop:3000;
        dvwa-tls        dvwa:80;
        vampi-tls       vampi:5000;
        crapi-tls       crapi-web:80;
    }

    server {
        listen 443 ssl;
        server_name juice-shop-tls dvwa-tls vampi-tls crapi-tls;
        ssl_certificate     /tls/front.pem;
        ssl_certificate_key /tls/front.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;

        location / {
            proxy_pass http://$target_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass_header Server;
            proxy_redirect ~^http://([^/]+)(.*)$ https://$host$2;
            proxy_read_timeout 30s;
        }
    }
}
