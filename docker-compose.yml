# CAWASMA development stack: api (FastAPI) + worker (Celery) + postgres + redis.
#
#   make up                 # or: docker compose up -d --build
#   curl localhost:8000/health
#
# The api container runs `alembic upgrade head` before serving. Configuration
# comes from .env (optional; copy .env.example). Container-to-container URLs
# are set below so .env can keep host-side values for local tooling.
#
# Evaluation targets (Asim) live in docker-compose.eval.yml on their own network.

name: cawasma

# One backend image, built once by `api`; worker (and demo-target in the demo
# overlay) run the same image and never pull it.
x-backend: &backend
  image: cawasma-backend:${CAWASMA_IMAGE_TAG:-dev}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cawasma}:${POSTGRES_PASSWORD:-cawasma}@postgres:5432/${POSTGRES_DB:-cawasma}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    LOG_FORMAT: ${LOG_FORMAT:-json}
  volumes:
    # Spec files (checks, CVSS mapping, chains); settings.CONFIG_DIR = /config.
    - ./config:/config:ro
  networks: [backend]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cawasma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cawasma}
      POSTGRES_DB: ${POSTGRES_DB:-cawasma}
    ports:
      - "${POSTGRES_HOST_PORT:-5446}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  api:
    <<: *backend
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    pull_policy: never
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      # Wait for the api so migrations have been applied.
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------- frontend
  # Neelam's Next.js app (frontend/Dockerfile, standalone output). Opt-in so
  # the backend starts on its own:
  #   docker compose --profile frontend up -d --build
  # NEXT_PUBLIC_API_URL is baked into the browser bundle at build time, so it
  # is the api as the BROWSER reaches it (published port). API_INTERNAL_URL is
  # the api service on the compose network, for server-side calls. Keep
  # FRONTEND_ORIGIN (CORS) in .env in sync with the published URL.
  frontend:
    profiles: [frontend]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8000}
    image: cawasma-frontend:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

# No fixed network name: each compose project (e.g. the clean-machine check's
# cawasma-clean) gets its own, so "postgres" never resolves into another stack.
networks:
  backend: {}

volumes:
  pgdata:
