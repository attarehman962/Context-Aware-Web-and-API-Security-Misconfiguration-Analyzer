[project]
name = "cawasma-backend"
version = "1.0.0"
description = "CAWASMA — context-aware web & API security misconfiguration analyzer (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web stack
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "starlette==0.41.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    # Database
    "SQLAlchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",          # required by SQLAlchemy async
    "alembic==1.14.0",          # runs on asyncpg too (migrations/env.py)
    # Async tasks + pub/sub
    "celery==5.4.0",
    "redis==5.2.1",
    # HTTP engine + parsing
    "httpx==0.28.1",
    "h2==4.1.0",                # HTTP/2 for the scan engine (httpx http2=True)
    "beautifulsoup4==4.12.3",
    "cryptography==44.0.0",     # TLS certificate parsing
    "sslyze==6.1.0",            # TLS protocols, cipher suites, certificate (once per host)
    # Reporting
    "weasyprint==63.1",
    "jinja2==3.1.4",
    # Spec files in config/ (checks, CVSS mapping, chains)
    "PyYAML==6.0.2",
    # Context-aware scoring: CVSS v3.1 environmental scores (app/core/cvss.py)
    "cvss==3.6",
]
# torch is not listed: it must come from PyTorch's CPU index, which pyproject
# cannot express. Install it first (docs/03-installation.md); the Docker image
# uses requirements-ml.txt, which sets the index.

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "aiosqlite==0.22.1",
    "respx==0.22.0",           # httpx mocking for the engine/crawler tests
    "ruff==0.8.4",
    "mypy==1.14.1",
    "types-PyYAML==6.0.12.20240917",
]
ml = [
    "sentence-transformers==3.3.1",
    "spacy==3.8.2",
    "preshed==3.0.9",          # 3.0.10+ breaks spacy.load (see requirements-ml.txt)
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "scikit-learn==1.6.0",
    "pandas==2.2.3",
    "matplotlib==3.9.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["data/*.txt"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "BLE"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "S110",  # best-effort cleanup (close/unsubscribe) in finally blocks is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S311"]
# Rule catalog and the HTML report template are data; long lines read better.
"app/core/checks/catalog.py" = ["E501"]
"app/core/reports.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["app", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "weasyprint.*", "sentence_transformers.*", "spacy.*", "bs4.*", "numpy.*", "cvss.*"]
ignore_missing_imports = true
