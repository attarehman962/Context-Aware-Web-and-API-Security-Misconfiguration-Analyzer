# Lets the CAWASMA api/worker scan the evaluation targets. Use together with
# the main file, after `make eval-up`:
#
#   docker compose -f docker-compose.yml -f docker-compose.eval-scan.yml up -d
#
# Joins the api and worker to the isolated cawasma-eval network and allows the
# target hostnames to resolve to private addresses (docs/engine-security.md).
# Never set ALLOWED_INTERNAL_HOSTS in the normal stack.

services:
  # The *-tls names are the harness's TLS front (eval/harness); its per-run CA
  # is trusted through SCAN_CA_BUNDLE, so certificate verification stays on.
  api:
    environment:
      ALLOWED_INTERNAL_HOSTS: juice-shop,dvwa,vampi,crapi-web,juice-shop-tls,dvwa-tls,vampi-tls,crapi-tls
      SCAN_CA_BUNDLE: /eval-tls/ca.pem
    volumes:
      - ./eval/.run/tls:/eval-tls:ro
    networks: [backend, eval]
  worker:
    environment:
      ALLOWED_INTERNAL_HOSTS: juice-shop,dvwa,vampi,crapi-web,juice-shop-tls,dvwa-tls,vampi-tls,crapi-tls
      SCAN_CA_BUNDLE: /eval-tls/ca.pem
    volumes:
      - ./eval/.run/tls:/eval-tls:ro
    networks: [backend, eval]

networks:
  eval:
    external: true
    name: cawasma-eval
